  # ==================================================================
  # 1b. 310S Automotive Service Technician Certification
  # ==================================================================
  # Added 2026-06-08 after live test (meeting_01_310s_automotive_strong)
  # produced an unguided ask_one_clarifying_question response when the
  # user asked "how can get 310S licence" -- 310S was not in the
  # registry, so router Rule 2 (training + entity) could not fire and
  # Rule 3 (training, no entity) emitted ask_slot=skills_text, which
  # the responder rendered as a generic skills-intake question.
  #
  # Sibling trade to 310T -- same regulator (Skilled Trades Ontario),
  # same compulsory-trade structure, distinct trade code. The wide
  # alias set covers the variations the engine has been seen to
  # surface from job postings ("310S Automotive Technician License")
  # and the variations a candidate is likely to type.
  - canonical_name: "310S automotive technician certification"
    aliases:
      - "310S"
      - "310S licence"
      - "310S license"
      - "310S certificate"
      - "310S certificate of qualification"
      - "310S Automotive Technician License"
      - "310S automotive technician licence"
      - "automotive service technician certificate"
      - "automotive service technician certification"
      - "automotive service technician licence"
      - "automotive service technician license"
    category: "credential"
    jurisdiction: "Ontario"
    requirement_level: "mandatory_to_practise"
    requirement_kind: "compulsory_trade_certificate"
    evidence_authority: "Skilled Trades Ontario"
    description: >-
      Ontario compulsory trade certification for automotive service
      technicians. Required by most automotive repair shops and
      dealerships in the province; earned through an apprenticeship
      registered with Skilled Trades Ontario plus the Certificate of
      Qualification exam.
    resources:
      - provider: "Skilled Trades Ontario"
        type: "credential_pathway"
        url: "https://www.skilledtradesontario.ca/trade-information/automotive-service-technician/"
        summary: >-
          The provincial regulator's 310S trade information page,
          including apprenticeship registration, training-standard
