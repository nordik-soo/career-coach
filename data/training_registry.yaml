      # "how can get this license G2/G" did not match because the
      # aliases above don't cover the G1/G2/G stage references that
      # Ontario candidates routinely use. The Class G entry already
      # describes those stages in its `description`; these aliases let
      # the message-scan path resolve them to this same canonical gap.
