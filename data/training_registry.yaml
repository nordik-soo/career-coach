      # CP4's canonicalize_skill path, which collapses "Class G driver's
      # license" -> "class g license". The US-spelling alias below was
      # missing, so registry.lookup() returned None and surface_url()
      # was never called. Adding it closes the Class G surfacing gap.
      - "Class G license"
      - "Class G licence"
      - "G license"
      - "G licence"
      - "Ontario driver's license"
      # Slice (2026-06-08): graduated-licence shorthand. Live-test
      # "how can get this license G2/G" did not match because the
      # aliases above don't cover the G1/G2/G stage references that
      # Ontario candidates routinely use. The Class G entry already
      # describes those stages in its `description`; these aliases let
      # the message-scan path resolve them to this same canonical gap.
      - "G2"
      - "G2 licence"
      - "G2 license"
      - "G2/G"
      - "G2/G licence"
      - "G2/G license"
      - "G2/G driver's license"
      - "G2/G driver's licence"
      - "G1"
      - "G1 licence"
      - "G1 license"
    category: "license"
    description: >-
      Standard Ontario driver's licence for passenger vehicles. Required by
      many employers for any role involving driving, deliveries, or site
      visits. Includes the G1 (knowledge), G2 (road test), and full G
      (advanced road test) stages.
    resources:
      - provider: "DriveTest"
        type: "credential_pathway"
        url: "https://drivetest.ca/"                           # TODO: deep link to "get your G" page
        summary: >-
          Official Ontario driver-testing provider; book the G1 knowledge
          test and G/G2 road tests here.
        verified_at: "2026-06-15"
        verified_by: "lead-engineer"
      - provider: "Ontario.ca"
        type: "credential_pathway"
        url: "https://www.ontario.ca/page/driver-licence"      # TODO: verify slug
        summary: >-
          Government overview of Ontario's graduated licensing system, fees,
          required documents, and exchange-licence policies for newcomers.
        verified_at: null
        verified_by: null
      - provider: "Sault Community Career Centre"
        type: "referral_only"
        url: null
        summary: >-
          For newcomers exchanging an out-of-country licence, SCCC can refer
          you to local driving schools and confirm what documents Ontario
          requires.
        verified_at: "2026-06-04"
        verified_by: "lead-engineer"

