# SkillBridge SSM — Training Registry (v1 seed)
#
# This file is the SOURCE OF TRUTH for training recommendations served by
# the chat. Every URL the chat cites for training must originate from this
# file. See:
#   docs/training-registry-schema.md      — field reference
#   docs/training-providers-allowlist.md  — who we link to and why
#
# ====================================================================
# REVIEW STATUS: PENDING HUMAN VERIFICATION
# ====================================================================
# The URLs below are candidate paths based on the providers' known site
# structures. The lead engineer MUST verify each one against the live site
# before merging this file and flipping the recommender on. Until then,
# this YAML is loaded only in tests/CI; the production loader is gated
# behind TRAINING_REGISTRY_ENABLED env var.
#
# Verification checklist per entry:
#   1. URL resolves (200 OK)
#   2. Page content matches the resource summary
#   3. URL is structured/durable (not a marketing landing redirected to a
#      different domain)
#   4. If URL passes, set verified_at to today's date and verified_by to
#      your GitHub handle or "lead-engineer"
#   5. If URL fails verification, EITHER find a replacement URL OR change
#      the resource type to "referral_only" and set url: null
# ====================================================================

version: 1
registry_verified_at: null   # set after end-to-end review; null = pending

gaps:

