        verified_at: "2026-06-30"
        verified_by: "codex"
      - provider: "Sault College"
        type: "apprenticeship"
        url: "https://www.saultcollege.ca/programs/apprenticeship/automotive-service-technician"
        summary: >-
          Sault College's Automotive Service Technician apprenticeship
          program -- local in-class instruction component of the 310S
          apprenticeship.
        verified_at: "2026-06-30"
        verified_by: "codex"
      - provider: "Sault Community Career Centre"
        type: "referral_only"
        url: null
        summary: >-
          Local employment-and-training counsellors who can map your
          current automotive experience against 310S apprenticeship
          requirements and help you find a sponsoring shop or
          dealership if you don't have one yet.
        verified_at: "2026-06-04"
        verified_by: "lead-engineer"

