# ====================================================================
# CASES
# ====================================================================
cases:

  # ==================================================================
  # Credential-gap block (F1 / F2 / F8 / F11 lineage)
  # ==================================================================

  - case_id: "c_truck_coach_no_class_g"
    expectation_status: "transcribed"      # F1, passes_today
    description: >-
      Truck & coach apprentice without an explicit Class G claim.
      Credential cap MUST fire regardless of skill overlap — the cap
      reason is the actionable signal, not the band.
    categories: ["credential_gap", "cap_semantics"]
    profile:
      target_role: "truck and coach technician apprentice"
      skill_phrases: ["welding", "truck maintenance", "vehicle inspection",
                      "parts fabrication", "diesel repair"]
      experience_text: "Apprentice Truck & Coach Technician at Northern Fleet Services (2023-present)"
      education_text: "Truck & Coach Technician Apprenticeship — Sault College"
      work_type_preference: "full-time"
    expect:
      diagnosis: "PREPARATION_GAP"
      jobs:
        - posting_id: "pb_truck_coach_grfn"
          band: "stretch"
          cap_reasons: ["band_capped_by_credential"]
          matched_required:
            - { requirement: "motor vehicle inspection", via_stage: "fuzzy", user_skill: "vehicle inspection" }
          missing_required_contains: ["class g"]
          blocking_credential: "class g driver's license"

  - case_id: "c_truck_coach_with_class_g"
    expectation_status: "transcribed"      # F2, passes_today
    description: >-
      Same apprentice WITH Class G. v1.2.0 vocabulary is specialized
      enough that the band honestly stays stretch — but the credential
      cap must NOT fire. Absence of the cap is the pinned contract.
    categories: ["credential_gap", "cap_semantics"]
    profile:
      target_role: "truck and coach technician"
      skill_phrases: ["welding", "truck maintenance", "vehicle inspection",
                      "parts fabrication", "diesel repair",
                      "Class G driver's license"]
      experience_text: "Apprentice Truck & Coach Technician at Northern Fleet Services"
      education_text: "Truck & Coach Technician Apprenticeship — Sault College"
      work_type_preference: "full-time"
    expect:
      diagnosis: "PREPARATION_GAP"
      jobs:
        - posting_id: "pb_truck_coach_grfn"
          band: "stretch"
          cap_reasons: []
          cap_reasons_forbidden: ["band_capped_by_credential"]
          matched_required:
            - { requirement: "class g driver's license", via_stage: "exact", user_skill: "Class G driver's license" }

  - case_id: "c_alias_licence_spelling"
    expectation_status: "transcribed"      # F8, fails_today_fixed_by_v2
    description: >-
      British 'licence' must canonicalise to the JD's American
      'license'. Contract: class g appears in matched_required via the
      exact (canonical) stage, and the credential cap does not fire.
    categories: ["credential_gap", "fuzzy_boundary"]
    profile:
      target_role: "truck and coach technician"
      skill_phrases: ["welding", "truck maintenance", "vehicle inspection",
                      "Class G licence"]
      experience_text: "Apprentice Truck & Coach Technician"
      work_type_preference: "full-time"
    expect:
      diagnosis: "PREPARATION_GAP"
      jobs:
        - posting_id: "pb_truck_coach_grfn"
          band: "stretch"
          cap_reasons_forbidden: ["band_capped_by_credential"]
          matched_required:
            - { requirement: "class g driver's license", via_stage: "exact", user_skill: "Class G licence" }

  - case_id: "c_credential_below_topn_visible"
    expectation_status: "transcribed"      # F11, passes_today
    description: >-
      Class G ranks 9 in v1.2.0 extraction — past the old top-5
      cutoff. The slice 4b carve-out must keep it in the matching set
      so the cap can fire honestly when the user lacks it. Vocabulary-
      independent intent: any credential below top-N must remain
      visible in required_missing.
    categories: ["credential_gap", "cap_semantics"]
    profile:
      target_role: "truck and coach technician"
      skill_phrases: ["welding", "truck maintenance", "vehicle inspection",
                      "parts fabrication", "outdoor work"]
      experience_text: "Apprentice Truck & Coach Technician (2 years)"
      work_type_preference: "full-time"
    expect:
      diagnosis: "PREPARATION_GAP"
      jobs:
        - posting_id: "pb_truck_coach_grfn"
          band: "stretch"
          cap_reasons: ["band_capped_by_credential"]
          missing_required_contains: ["class g"]
          blocking_credential: "class g driver's license"

  # ==================================================================
  # Negative controls (F3 / cv_05 / meeting_03 lineage)
  # ==================================================================

  - case_id: "c_software_dev_negative_control"
    expectation_status: "authored"
    description: >-
      Software developer profile, no software postings in the bank.
      Generic-skill overlap (customer service adjacency, data entry)
      must not promote the admin posting or anything else. Diagnosis:
      target NOC has zero local postings and strict-AND adjacency
      should return empty -> NO_OPPORTUNITY_FOUND. VERIFY on first
      run: if adjacency legitimately fires, the right fix is
      tightening accept_candidates, not relaxing this expectation.
    categories: ["negative_control", "no_match"]
    profile:
      target_role: "software developer"
      skill_phrases: ["Python", "React", "PostgreSQL", "Docker", "AWS",
                      "machine learning", "data analysis"]
      experience_text: "Data Analyst at Telus International (5 years)"
      education_text: "BSc Computer Science, University of Toronto"
      work_type_preference: "full-time"
    expect:
      diagnosis: "NO_OPPORTUNITY_FOUND"
      jobs_absent: ["pb_truck_coach_grfn", "pb_front_desk_quality_inn",
                    "pb_ops_manager_cygnus", "pb_auto_tech_northside",
                    "pb_electrician_puc", "pb_admin_assistant_pt"]

  - case_id: "c_airline_pilot_negative_control"
    expectation_status: "authored"         # meeting_03 archetype
    description: >-
      Airline pilot profile. Zero target-NOC postings, no credible
      skill adjacency into the bank. Nothing surfaces.
    categories: ["negative_control", "no_match"]
    profile:
      target_role: "airline pilot"
      skill_phrases: ["commercial flight operations", "instrument flight rules",
                      "flight planning", "crew resource management"]
      experience_text: "First Officer, regional carrier (6 years)"
      work_type_preference: "full-time"
    expect:
      diagnosis: "NO_OPPORTUNITY_FOUND"
      jobs_absent: ["pb_truck_coach_grfn", "pb_front_desk_quality_inn",
                    "pb_ops_manager_cygnus", "pb_auto_tech_northside",
                    "pb_electrician_puc", "pb_admin_assistant_pt"]

  # ==================================================================
  # Caps and floors (F4 / F7 lineage + work-type)
  # ==================================================================

  - case_id: "c_exact_title_zero_skills"
    expectation_status: "authored"         # F4, changed 2026-07-16
    description: >-
      User types the exact Cygnus title with no skills and no
      experience. Step 2 cutover 2026-07-16 retired the title-match-
      override signal; title similarity no longer surfaces postings
      or contributes to substantive_evidence. The honest Step 2
      outcome is UNDETERMINED — target_role is set but there's no
      non-credential skill and no experience_text to score against.
      Pre-Step-2 this case exercised the direct-title early-return
      path and expectation was transcribed as PREPARATION_GAP. The
      Step 2 expected outcome is authored, not transcribed — the
      design decision to retire title-based substantive evidence
      changes what "correct" looks like for this input archetype.
    # Kept under 'direct_title' category so eval coverage still
    # exercises this archetype; the case now locks Step 2's honest
    # UNDETERMINED outcome for direct-title requests with zero
    # substantive evidence (skills empty, no experience_text).
    categories: ["direct_title"]
    profile:
      target_role: "Senior Manager of Operations & Client Services"
      skill_phrases: []
    expect:
      diagnosis: "UNDETERMINED"
      jobs: []

  - case_id: "c_no_experience_floor"
    expectation_status: "transcribed"      # F7, fails_today_fixed_by_v2
    description: >-
      High skill overlap but no experience_text. v2 caps at stretch —
      skills without context don't prove fit. Asserts the explicit
      flag so a floor that silently stops firing fails the suite.
    categories: ["cap_semantics"]
    profile:
      target_role: "customer service representative"
      skill_phrases: ["customer service", "phone communication",
                      "computer systems", "communication", "payment processing"]
      work_type_preference: "full-time"
    expect:
      diagnosis: "PREPARATION_GAP"
      jobs:
        - posting_id: "pb_front_desk_quality_inn"
          band: "stretch"
          cap_reasons: ["band_capped_by_no_experience"]

  - case_id: "c_work_type_mismatch_cap"
    expectation_status: "authored"
    description: >-
      Full-time seeker vs part-time admin posting with real skill
      overlap. The work-type gate must cap the band and record its
      reason rather than silently down-scoring.
    categories: ["work_type", "cap_semantics"]
    profile:
      target_role: "administrative assistant"
      skill_phrases: ["scheduling", "document management",
                      "customer service", "data entry"]
      experience_text: "Office administrator, 4 years"
      work_type_preference: "full-time"
    expect:
      diagnosis: "PREPARATION_GAP"
      jobs:
        - posting_id: "pb_admin_assistant_pt"
          band: "stretch"
          cap_reasons: ["band_capped_by_work_type_mismatch"]

  # ==================================================================
  # Honest-stretch and happy paths (F5 / cv_01 / cv_03 / cv_04 /
  # meeting_01 / meeting_02 lineage)
  # ==================================================================

  - case_id: "c_cs_to_hotel_stretch"
    expectation_status: "transcribed"      # F5, passes_today
    description: >-
      Generic CS rep vs hotel front desk. Honest stretch — has the CS
      basics, missing the hotel-specific stack. Transferable skills
      must not inflate the band.
    categories: ["ready_to_apply", "cap_semantics"]
    profile:
      target_role: "customer service representative"
      skill_phrases: ["customer service", "phone communication",
                      "computer systems", "attention to detail",
                      "communication", "payment processing",
                      "multitasking", "conflict resolution"]
      experience_text: "3 years retail customer service"
      education_text: "Ontario Secondary School Diploma"
      work_type_preference: "full-time"
    expect:
      diagnosis: "PREPARATION_GAP"
      jobs:
        - posting_id: "pb_front_desk_quality_inn"
          band: "stretch"
          matched_required:
            - { requirement: "customer service",   via_stage: "exact", user_skill: "customer service" }
            - { requirement: "payment processing", via_stage: "exact", user_skill: "payment processing" }
          missing_required_contains: ["guest check-in"]

  - case_id: "c_front_desk_full_coverage"
    expectation_status: "authored"         # cv_04 archetype, upgraded
    description: >-
      Experienced hotel front-desk profile covering every required
      skill on the Quality Inn posting. Expect band good-or-better
      with empty required_missing -> READY_TO_APPLY. This is the
      happy-path counterweight to c_cs_to_hotel_stretch: same posting,
      the delta is exactly the hotel-specific stack.
    categories: ["ready_to_apply"]
    profile:
      target_role: "front desk agent"
      skill_phrases: ["guest check-in", "reservation management",
                      "property management system", "customer service",
                      "payment processing", "phone communication"]
      experience_text: "Front Desk Agent, Delta Hotels (3 years)"
      work_type_preference: "full-time"
    expect:
      diagnosis: "READY_TO_APPLY"
      jobs:
        - posting_id: "pb_front_desk_quality_inn"
          band: "good"          # floor assertion; strong also acceptable -> see band_at_least
          band_at_least: true   # loader interprets band as a minimum for this case
          cap_reasons: []
          matched_required:
            - { requirement: "guest check-in",             via_stage: "exact", user_skill: "guest check-in" }
            - { requirement: "property management system", via_stage: "exact", user_skill: "property management system" }

  - case_id: "c_310s_full_coverage"
    expectation_status: "authored"         # meeting_01 "perfect" archetype
    description: >-
      Certified 310S tech with Class G and full skill coverage.
      Credentialed happy path: both credentials matched exact, no
      caps, READY_TO_APPLY.
    categories: ["ready_to_apply", "credential_gap"]
    profile:
      target_role: "automotive service technician"
      skill_phrases: ["automotive diagnostics", "brake system repair",
                      "preventive maintenance",
