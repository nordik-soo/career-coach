# SkillBridge SSM — Matching Eval Corpus (v1 seed)
#
# This file is the frozen gold-label truth table for the matching engine.
# See docs/matching-eval-corpus-schema.md for the field reference and the
# loader / CI / human-review validation split.
#
# ====================================================================
# REVIEW STATUS: PENDING HUMAN VERIFICATION
# ====================================================================
# One thing REQUIRES lead-engineer action before this corpus gates CI:
#
#   EXPECTATION REVIEW. Cases tagged `expectation_status: authored`
#   encode intended behaviour, not verified engine output. First
#   suite run will show disagreements; each one is EITHER an engine
#   bug OR a wrong expectation — resolve per the human-review rule
#   in the schema doc, never by blind-updating to whatever the
#   engine emitted. Cases tagged `transcribed` carry expectations
#   copied from fixtures that pass today.
# ====================================================================
#
# ====================================================================
# POSTING BANK PROVENANCE (locked 2026-07-02)
# ====================================================================
# All 6 postings in this bank are SYNTHETIC test fixtures marked
# `is_synthetic: true`. None is transcribed from a live SCCC row.
#
# Background: the initial import of this artifact (commit 6f3343c)
# claimed 3 postings (pb_truck_coach_grfn, pb_ops_manager_cygnus,
# pb_front_desk_quality_inn) could be transcribed from
# core.v_current_job as future work. On check, those specific SCCC
# rows had rotated out of the dataset between fixture authoring and
# corpus import. Rather than substitute currently-live postings
# (which would mutate test intent and re-introduce drift on the
# next SCCC rotation), the honest correction is to reclassify all
# 6 postings as intentional synthetic constructs.
#
# The corpus's goal is frozen determinism, not live-data mirroring.
# Gold corpus examples should be stable enough to test the engine,
# not realistic enough to expire.
#
# `transcribed_from_sccc: false` remains on all 6 postings as a
# forward-looking field. A future contributor MAY add real-SCCC-
# anchored postings alongside the synthetic ones by flagging them
# `transcribed_from_sccc: true` with a snapshot date; the field
# provides provenance for any such additions. `is_synthetic: true`
# is the positive claim explaining WHY the transcription flag is
# false today.
# ====================================================================
#
# Seed coverage vs. the CI floor (36): this seed has 17 cases. Gaps to
# fill before flipping CI to the corpus, by category:
#   credential_gap        4/6   (need: regulated non-trade case, 309A-missing case)
#   negative_control      2/4   (need: 2 more off-domain profiles)
#   no_match/thin         3/6   (need: MARKET_DATA_UNAVAILABLE engine-failure
#                                injection; more UNDETERMINED shapes)
#   semantic+fuzzy        3/8   (need: fuzzy_boundary pairs both sides;
#                                more threshold-adjacent cosine pairs)
#   cap/work_type/family  3/6   (need: family_gate leakage case with
#                                jobs_absent; second work_type shape)
#   happy paths           5/6   (need: adjacent_only case once the
#                                SKILL_ADJACENT_AVAILABLE input shape is pinned)

corpus_version: 1
corpus_verified_at: null          # set after end-to-end review
engine_version_pinned: "job-match-v1.2.0"

# The frozen anchor date `posted_days_ago` resolves against. Loader
# constant mirrors this; recency boosts are deterministic forever.
frozen_today: "2026-07-01"

# ====================================================================
# Embedding fixtures — the ONLY pairs with nonzero cosine in the eval
# harness. _semantic_match_strength's lookup is monkeypatched to this
# table; unlisted pairs resolve to 0.0. Threshold is 0.70, semantic
# strength cap 0.75 (config.py:415).
# ====================================================================
embedding_fixtures:
  - a: "client intake coordination"
    b: "customer onboarding"
    cosine: 0.74        # above threshold -> matches, strength capped 0.75
  - a: "front desk reception"
    b: "customer onboarding"
    cosine: 0.68        # below threshold -> must NOT match

